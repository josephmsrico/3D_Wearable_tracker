; PlatformIO Project Configuration File
;
; ============ BOARD REGISTER ============
; Label | Role        | Port (CH343)
; HUB   | Command Hub | /dev/cu.usbmodem5B910185331
; T1    | Tracker 1   | /dev/cu.usbmodem5B910183381
; A1    | Anchor 1    | /dev/cu.usbmodem5B910188781
; A2    | Anchor 2    | (waiting for board)
; ========================================

; ---------- Settings shared by ALL boards ----------
[env]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.psram_type = qio

; ---------- Tracker 1 ----------
[env:tracker1]
build_src_filter = +<Tracker/>
lib_deps =
    adafruit/Adafruit ICM20X
    adafruit/Adafruit BMP3XX Library
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    h2zero/NimBLE-Arduino
    adafruit/Adafruit NeoPixel
build_flags = ${env.build_flags} -DTRACKER_ID=1
upload_port  = /dev/cu.usbmodem5B910183381   ; board is T1
monitor_port = /dev/cu.usbmodem5B910183381

; ---------- Anchor 1 ----------
[env:anchor1]
build_src_filter = +<Anchor/>
lib_deps =
    h2zero/NimBLE-Arduino
    adafruit/Adafruit NeoPixel
build_flags = ${env.build_flags} -DANCHOR_ID=1
upload_port  = /dev/cu.usbmodem5B910188781   ; board is A1
monitor_port = /dev/cu.usbmodem5B910188781

; ---------- Anchor 2 (waiting for board) ----------
[env:anchor2]
build_src_filter = +<Anchor/>
lib_deps =
    h2zero/NimBLE-Arduino
    adafruit/Adafruit NeoPixel
build_flags = ${env.build_flags} -DANCHOR_ID=2
upload_port  = /dev/cu.usbmodem5B910191351    ; board is A2 — paste its port
monitor_port = /dev/cu.usbmodem5B910191351

; ---------- Command Hub ----------
[env:command_hub]
build_src_filter = +<Command_Hub/>
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
lib_deps =
    esp32async/ESPAsyncWebServer
    esp32async/AsyncTCP
    h2zero/NimBLE-Arduino
    adafruit/Adafruit NeoPixel
upload_port  = /dev/cu.usbmodem5B910185331   ; board is HUB
monitor_port = /dev/cu.usbmodem5B910185331
; ---------- I2C scanner (diagnostic) ----------
 