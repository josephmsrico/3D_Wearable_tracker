; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
[env:tracker]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem5B910183381
monitor_port = /dev/cu.usbmodem5B910183381
build_src_filter = +<Tracker/>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
board_build.flash_size = 16MB
board_build.psram_type = qio
lib_deps =
    adafruit/Adafruit ICM20X
    adafruit/Adafruit BMP3XX Library
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    h2zero/NimBLE-Arduino
    adafruit/Adafruit NeoPixel

[env:anchor]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem5B910188781
monitor_port = /dev/cu.usbmodem5B910188781
build_src_filter = +<Anchor/>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    h2zero/NimBLE-Arduino
    adafruit/Adafruit NeoPixel

[env:command_hub]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem5B910185331
monitor_port = /dev/cu.usbmodem5B910185331
build_src_filter = +<Command_Hub/>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0